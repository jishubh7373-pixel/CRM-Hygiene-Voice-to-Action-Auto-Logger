version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: dealflow-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: dealflow_ai
    networks:
      - dealflow-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: dealflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dealflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dealflow-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - CLIENT_URL=http://localhost:5173
      - MONGODB_URI=mongodb://mongodb:27017/dealflow_ai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=dealflow_default_jwt_access_secret_dev_32char
      - JWT_REFRESH_SECRET=dealflow_default_jwt_refresh_secret_dev_32char
      - INTEGRATION_ENCRYPTION_KEY=dealflow_integrations_secret_key_32bytes_hex!!
    volumes:
      - audio_uploads:/app/uploads/audio
    networks:
      - dealflow-network

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker
    container_name: dealflow-worker
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/dealflow_ai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - INTEGRATION_ENCRYPTION_KEY=dealflow_integrations_secret_key_32bytes_hex!!
    volumes:
      - audio_uploads:/app/uploads/audio
    networks:
      - dealflow-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: dealflow-client
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - dealflow-network

  proxy:
    image: nginx:1.25-alpine
    container_name: dealflow-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - client
    networks:
      - dealflow-network

networks:
  dealflow-network:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  audio_uploads:
