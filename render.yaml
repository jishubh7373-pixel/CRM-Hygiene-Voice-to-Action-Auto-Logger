services:
  # ---------------------------------------------------------------------------
  # DealFlow AI — Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: dealflow-ai-server
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: OPENAI_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # DealFlow AI — Frontend Static Site
  # ---------------------------------------------------------------------------
  - type: static
    name: dealflow-ai-client
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
